<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Darija Translator – Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="bar">
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Darija Translator – Settings</h1>
  </header>
  <form id="form" class="page">
    <label>Server URL
      <input type="url" id="serverUrl" required placeholder="http://localhost:8080">
      <span>Where the Java REST service runs.</span>
    </label>
    <label>Username
      <input type="text" id="username" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" id="password" required autocomplete="current-password">
      <span>Sent with HTTP Basic authentication. Stored only in this browser profile.</span>
    </label>
    <div class="row">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="test" class="ghost">Test connection</button>
    </div>
    <p id="result" class="message" role="status"></p>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
