<!doctype html><html lang="en"><head><meta charset="utf-8"><title>UML</title>
<link rel="stylesheet" href="stage.css">
<style>
body { background: #fff; overflow: hidden; }
header { position: fixed; top: 0; left: 0; right: 0; padding: 10px 18px; font-weight: 600; background: rgba(255,255,255,.92);
  border-bottom: 3px solid var(--red); z-index: 2; }
#wrap { position: absolute; inset: 48px 0 0 0; overflow: hidden; }
#img { position: absolute; left: 0; top: 0; transform-origin: 0 0; transition: transform 1.1s cubic-bezier(.4,0,.2,1); }
</style></head><body>
<header id="title">Diagram</header>
<div id="wrap"><img id="img" alt=""></div>
<script>
const q = new URLSearchParams(location.search);
const img = document.getElementById('img');
document.getElementById('title').textContent = q.get('title') || 'Diagram';
img.src = q.get('img');
// fit the whole image, then the director can zoom with window.zoomTo(x, y, w, h) in image pixels
function fit() {
  const W = innerWidth, H = innerHeight - 48;
  const s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
  img.style.transform = `translate(${(W - img.naturalWidth * s) / 2}px, ${(H - img.naturalHeight * s) / 2}px) scale(${s})`;
}
window.fit = fit;
window.zoomTo = (x, y, w, h) => {
  const W = innerWidth, H = innerHeight - 48;
  const s = Math.min(W / w, H / h);
  img.style.transform = `translate(${-x * s + (W - w * s) / 2}px, ${-y * s + (H - h * s) / 2}px) scale(${s})`;
};
img.onload = () => { img.style.transition = 'none'; fit(); requestAnimationFrame(() => img.style.transition = ''); window.ready = true; };
</script>
</body></html>
