<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Darija Translator – Demo</title>
<link rel="stylesheet" href="stage.css">
<style>
body { background: radial-gradient(1200px 600px at 20% 0%, #fff 0%, var(--paper) 60%); color: var(--ink); display: grid; place-items: center; }
.card { text-align: center; padding: 40px; max-width: 900px; }
.logo { width: 110px; height: 110px; border-radius: 24px; box-shadow: 0 10px 30px rgba(193,39,45,.25); }
h1 { font-size: 46px; margin: 22px 0 4px; letter-spacing: -.5px; }
h1 span { color: var(--red); }
.ar { font-family: "Geeza Pro", serif; font-size: 34px; color: var(--green); margin: 6px 0 18px; }
p { font-size: 20px; color: #555; margin: 4px 0; }
.chips { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 26px; }
.chip { border: 1px solid #ddd5cc; background: #fff; padding: 7px 14px; border-radius: 999px; font-size: 15px; }
.who { margin-top: 30px; font-size: 16px; color: #777; }
</style></head><body>
<div class="card fade-in">
  <img class="logo" src="/ext/icons/icon128.png" alt="">
  <h1>Darija <span>Translator</span></h1>
  <div class="ar">ترجمة للدارجة المغربية</div>
  <p>An LLM-powered RESTful web service · Mini Project 2</p>
  <div class="chips">
    <span class="chip">Jakarta REST</span><span class="chip">Jakarta Authentication</span><span class="chip">Embedded Tomcat</span>
    <span class="chip">LLM</span><span class="chip">Chrome extension</span><span class="chip">PHP · Python · React Native</span>
  </div>
  <div class="who">El Mehdi Bouzidi Idrissi · Al Akhawayn University · Pr. El Habib Nfaoui</div>
</div>
</body></html>
