<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Terminal</title>
<link rel="stylesheet" href="stage.css">
<style>
body { background: #2a2d33; display: grid; place-items: stretch; padding: 18px; }
.win { background: #15171b; border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.45); display: grid; grid-template-rows: 34px 1fr; overflow: hidden; }
.bar { background: #24272d; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #9aa3ad; font-size: 13px; }
.bar i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.bar .t { margin: 0 auto; transform: translateX(-30px); }
#out { margin: 0; padding: 14px 18px 40px; overflow: auto; color: #d7dde4; white-space: pre-wrap; word-break: break-word;
  font: 15px/1.5 "SF Mono", ui-monospace, Menlo, monospace; scroll-behavior: smooth; }
.p { color: #7ee787; } .cwd { color: #79c0ff; } .cmd { color: #fff; font-weight: 600; }
.ok { color: #7ee787; } .err { color: #ff7b72; } .dim { color: #8b949e; } .ar { font-family: "Geeza Pro", "SF Mono", monospace; font-size: 17px; }
.caret { display: inline-block; width: 9px; height: 18px; background: #d7dde4; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style></head><body>
<div class="win">
  <div class="bar"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i><span class="t" id="title">darija-translator — zsh</span></div>
  <pre id="out"></pre>
</div>
<script>
const out = document.getElementById('out');
let caret = null;
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
function scroll() { out.scrollTop = out.scrollHeight; }
function setCaret(on) {
  caret?.remove(); caret = null;
  if (on) { caret = document.createElement('span'); caret.className = 'caret'; out.appendChild(caret); }
}
window.term = {
  clear() { out.innerHTML = ''; },
  title(t) { document.getElementById('title').textContent = t; },
  prompt(cwd) {
    setCaret(false);
    out.insertAdjacentHTML('beforeend', `<span class="p">➜</span> <span class="cwd">${esc(cwd)}</span> `);
    setCaret(true); scroll();
  },
  async type(cmd, cps = 38) {
    setCaret(false);
    const span = document.createElement('span'); span.className = 'cmd'; out.appendChild(span);
    for (const ch of cmd) { span.textContent += ch; scroll(); await new Promise(r => setTimeout(r, 1000 / cps + Math.random() * 18)); }
    setCaret(true);
    await new Promise(r => setTimeout(r, 250));
    setCaret(false);
    out.insertAdjacentText('beforeend', '\n');
  },
  write(text, cls) {
    setCaret(false);
    const html = esc(text).replace(/([؀-ۿ][؀-ۿ\s،؟.!,]*)/g, '<span class="ar">$1</span>')
      .replace(/(HTTP\/1\.1 2\d\d|BUILD SUCCESS|Tests run: \d+, Failures: 0, Errors: 0)/g, '<span class="ok">$1</span>')
      .replace(/(HTTP\/1\.1 [45]\d\d|BUILD FAILURE|Unauthorized)/g, '<span class="err">$1</span>');
    out.insertAdjacentHTML('beforeend', cls ? `<span class="${cls}">${html}</span>` : html);
    scroll();
  },
};
window.ready = true;
</script>
</body></html>
